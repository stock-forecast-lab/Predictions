name: V1 daily forecast
on:
  workflow_dispatch:
    inputs:
      market:
        description: Market
        type: choice
        options: [BOTH, JP, US]
        default: BOTH
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '30 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: stock-forecast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dashboard and archive regression tests
        run: python -m pytest -q tests --ignore=tests/v2
      - name: V2 regression tests
        run: python -m pytest -q tests/v2 -c tests/v2/pytest.ini
      - name: Run V1 forecasts
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MARKET: ${{ inputs.market }}
        shell: bash
        run: |
          set -euo pipefail
          market="$REQUESTED_MARKET"
          if [[ "$EVENT" != 'workflow_dispatch' ]]; then
            if [[ "$SCHEDULE" == '30 7 * * 1-5' ]]; then market=JP; else market=US; fi
          fi
          status=0
          if [[ "$market" == JP || "$market" == BOTH ]]; then
            python models/v1/run.py --market JP || status=1
          fi
          if [[ "$market" == US || "$market" == BOTH ]]; then
            python models/v1/run.py --market US || status=1
          fi
          exit "$status"
      - name: Append canonical records and refresh common dashboard
        if: always()
        run: |
          python -m dashboard.normalize
          python -m dashboard.build --refresh-benchmarks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V1-${{ github.run_id }}
          path: |
            predictions
            evaluations/v1
            evaluations/v2
            records
            data/universes
            data/benchmarks
            docs/index.html
            dashboard/data.json
          if-no-files-found: ignore
      - name: Preserve complete forecast, evaluation and dashboard files
        if: always()
        shell: bash
        run: |
          python scripts/publish_results.py --branch "$GITHUB_REF_NAME" --message "forecast: V1 run $GITHUB_RUN_ID"
