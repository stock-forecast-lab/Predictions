name: V3 daily forecast
on:
  workflow_dispatch:
    inputs:
      market:
        description: Market
        type: choice
        options: [JP, US, BOTH]
        default: JP
      mode:
        description: sync builds history; forecast syncs then estimates when ready
        type: choice
        options: [forecast, sync]
        default: forecast
      base_set:
        description: V2 information set for the matched control
        type: choice
        options: [M3, M2, M1]
        default: M3
      profile:
        description: Model capacity
        type: choice
        options: [light, standard]
        default: light
      max_scan_days:
        description: EDINET historical calendar days per run (progress is retained)
        type: number
        default: 730
  schedule:
    - cron: '30 8 * * 1-5'
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: stock-forecast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify integrated release
        run: |
          cat RELEASE.txt
          python scripts/verify_release.py
          sha256sum models/v3/main.py models/v2/context_data.py
      - run: pip install -r requirements.txt
      - name: Shared regression tests
        run: python -m pytest -q tests --ignore=tests/v2 --ignore=tests/v3
      - name: V3 regression tests
        run: python -m pytest -q tests/v3 -c tests/v3/pytest.ini
      - name: Run V3 forecasts or synchronize financial history
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MARKET: ${{ inputs.market }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_BASE: ${{ inputs.base_set }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
          REQUESTED_DAYS: ${{ inputs.max_scan_days }}
        shell: bash
        run: |
          set -euo pipefail
          market="$REQUESTED_MARKET"
          if [[ "$EVENT" != workflow_dispatch ]]; then
            if [[ "$SCHEDULE" == '30 8 * * 1-5' ]]; then market=JP; else market=US; fi
          fi
          base="${REQUESTED_BASE:-M3}"
          profile="${REQUESTED_PROFILE:-light}"
          days="${REQUESTED_DAYS:-730}"
          args=(--base-set "$base" --profile "$profile" --max-scan-days "$days")
          if [[ "$REQUESTED_MODE" == sync ]]; then args+=(--sync-only); fi
          status=0
          if [[ "$market" == JP || "$market" == BOTH ]]; then
            timeout --signal=TERM 140m python -m models.v3.main --market JP "${args[@]}" || status=1
          fi
          if [[ "$market" == US || "$market" == BOTH ]]; then
            timeout --signal=TERM 140m python -m models.v3.main --market US "${args[@]}" || status=1
          fi
          exit "$status"
      - name: Append canonical records and refresh common dashboard
        if: always()
        run: |
          python -m dashboard.normalize
          python -m dashboard.build --refresh-benchmarks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V3-${{ github.run_id }}
          path: |
            predictions
            evaluations
            records
            data/fundamentals/v3
            data/universes
            data/benchmarks
            docs/index.html
            dashboard/data.json
          if-no-files-found: ignore
      - name: Preserve complete forecast, financial history and dashboard files
        if: always()
        run: python scripts/publish_results.py --branch "$GITHUB_REF_NAME" --message "forecast financial-sync V3 run $GITHUB_RUN_ID"
