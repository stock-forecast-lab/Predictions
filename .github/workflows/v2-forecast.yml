name: V2 daily forecast

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market
        type: choice
        options: [JP, US, BOTH]
        default: JP
      information_sets:
        description: Information sets
        type: choice
        options: [M1, ALL]
        default: M1

jobs:
  registration:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Select integration/v2-dashboard to run the forecast."
