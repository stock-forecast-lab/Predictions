name: V2 daily forecast
on:
  workflow_dispatch:
    inputs:
      market:
        description: Market
        type: choice
        options: [BOTH, JP, US]
        default: BOTH
      information_sets:
        description: M2/M3 require FRED_API_KEY
        type: choice
        options: [ALL, M1]
        default: ALL
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '30 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: stock-forecast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dashboard and archive regression tests
        run: python -m pytest -q tests --ignore=tests/v2
      - name: V2 regression tests
        run: python -m pytest -q tests/v2 -c tests/v2/pytest.ini
      - name: Run V2 forecasts
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MARKET: ${{ inputs.market }}
          REQUESTED_SETS: ${{ inputs.information_sets }}
        shell: bash
        run: |
          set -euo pipefail
          market="$REQUESTED_MARKET"
          if [[ "$EVENT" != 'workflow_dispatch' ]]; then
            if [[ "$SCHEDULE" == '30 7 * * 1-5' ]]; then market=JP; else market=US; fi
          fi
          sets=(M1 M2 M3)
          if [[ "$REQUESTED_SETS" == M1 ]]; then sets=(M1); fi
          status=0
          if [[ "$market" == JP || "$market" == BOTH ]]; then
            python models/v2/main.py --market JP --sets "${sets[@]}" || status=1
          fi
          if [[ "$market" == US || "$market" == BOTH ]]; then
            python models/v2/main.py --market US --sets "${sets[@]}" || status=1
          fi
          exit "$status"
      - name: Append canonical records and refresh common dashboard
        if: always()
        run: |
          python -m dashboard.normalize
          python -m dashboard.build --refresh-benchmarks
      - name: Preserve complete forecast, evaluation and dashboard files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for dir in predictions evaluations/v1 evaluations/v2 output/evaluations data/universes data/benchmarks records docs dashboard/data.json; do
            if [[ -e "$dir" ]]; then git add "$dir"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "forecast: V2 run $GITHUB_RUN_ID"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V2-${{ github.run_id }}
          path: |
            predictions
            evaluations/v1
            evaluations/v2
            records
            docs/index.html
            dashboard/data.json
          if-no-files-found: ignore
